<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Chat App Simpel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <section class="loading-card" id="loading-screen" aria-labelledby="page-title">
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 18.5V6.8C5 5.806 5.806 5 6.8 5h10.4c.994 0 1.8.806 1.8 1.8v7.4c0 .994-.806 1.8-1.8 1.8H10l-5 2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M8.5 9.5h7M8.5 13h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 id="page-title">Chat App Simpel</h1>
            <p class="message">Menyiapkan ruang obrolan untukmu...</p>
            <div class="loader" role="status" aria-label="Sedang memuat">
                <span class="sr-only">Sedang memuat</span>
            </div>
        </section>

        <section class="account-screen" id="account-options" aria-labelledby="account-title" hidden>
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 18.5V6.8C5 5.806 5.806 5 6.8 5h10.4c.994 0 1.8.806 1.8 1.8v7.4c0 .994-.806 1.8-1.8 1.8H10l-5 2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M8.5 9.5h7M8.5 13h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 id="account-title" tabindex="-1">Chat App Simpel</h1>
            <p class="message">Sudah punya akun?</p>
            <button class="open-button" type="button" onclick="window.location.href='/pages/login.html'">Login</button>
            <p class="register-prompt">
                Belum punya akun?
                <a class="register-link" href="/pages/register.html">Register here</a>
            </p>
        </section>
    </main>

    <script>
        window.setTimeout(() => {
            document.getElementById("loading-screen").hidden = true;
            document.getElementById("account-options").hidden = false;
            document.getElementById("account-title").focus();
        }, 1500);
    </script>
</body>
</html>
