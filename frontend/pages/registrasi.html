<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Registrasi - Chat App Simpel</title>
    <link rel="stylesheet" href="../css/registrasi.css">
</head>
<body>
    <nav>
        <a href="../index.html" class="back-link">Kembali</a>
    </nav>

    <main>
        <section class="registration-card" aria-labelledby="registration-title">
            <h1 id="registration-title">Registrasi</h1>
            <form class="registration-form">

                <!-- Rehgistrasi Nama depan-->
                <label for="nama-depan">Nama Depan</label>
                <input type="text" id="nama-depan" name="nama_depan" autocomplete="given-name" placeholder="Masukkan nama depan" required>
                <div class="error" id="error-nama-depan"></div>

                <!-- Registrasi Nama belakang -->
                <label for="nama-belakang">Nama Belakang</label>
                <input type="text" id="nama-belakang" name="nama_belakang" autocomplete="family-name" placeholder="Masukkan nama belakang" required>
                <div class="error" id="error-nama-belakang"></div>

                <!-- Registrasi Email -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="ilhamxxxx@gmail.com" required>
                <div class="error" id="error-email"></div>

                <!-- Registrasi Nomor HP -->
                <label for="hp">Nomor HP</label>
                <div class="kolom-hp">
                    <button type="button" class="pilih-negara" id="btn-negara" aria-haspopup="listbox" aria-expanded="false" aria-label="pilih kode negara">
                        <img class="bendera" id="bendera-terpilih" src="../assets/img/flags/id.svg" alt="Bendera Indonesia">
                        <span id="kode-terpilih">+62</span>
                        <svg class="ikon" viewbox="0 0 24 24" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
                    </button>
                    <input type="tel" id="hp" autocomplete="tel-national" placeholder="Masukkan Nomor HP anda" inputmode="tel" required>
                    <div class="daftar-negara" id="daftar-negara" hidden>
                        <input type="search" id="cari-negara" placeholder="Cari negara atau kode" autocomplete="off">
                        <ul id="isi-negara" role="listbox"></ul>
                    </div>
                </div>
                <div class="error" id="error-hp"></div>

                <!-- Registrasi password -->
                <label for="sandi">sandi</label>
                <div class="kolom-sandi">
                    <input type="password" id="sandi" autocomplete="new-password" placeholder="Min 8 karakter yang terdiri angka dan huruf" required>
                    <button type="button" class="lihat" data-target="sandi">lihat</button>
                </div>
                <div class="error" id="error-sandi"></div>

                <!-- Registrasi konfirmasi password -->
                <label for="konfirmasi-sandi">Ulangi Sandi</label>
                <div class="kolom-sandi">
                    <input type="password" id="konfirmasi-sandi" autocomplete="new-password" placeholder="masukkan kata sandi yang sama">
                    <button type="button" class="lihat" data-target="konfirmasi-sandi">lihat</button>
                </div>
                <div class="error" id="error-konfirmasi-sandi"></div>

                <button type="submit" class="tombol">Registrasi</button>
            </form>
            <p class="account-prompt">
                Sudah punya akun?
                <a class="account-link" href="login.html">Login di sini</a>
            </p>
        </section>
    </main>

    <footer>
        <p> &copy; 2026 Chat App Simpel. All rights reserved.</p>
    </footer>
    <script src="../js/registrasi.js" defer></script>
</body>
</html>
