<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Login - Chat App Simpel</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <nav>
        <a href="../index.html" class="back-link">Kembali</a>
    </nav>

    <main>
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Login</h1>
            <p class="auth-message" id="auth-message" role="status" hidden>
            </p>
            <form class="login-form">
                <label for="name">Nama</label>
                <input type="text" id="name" name="name" autocomplete="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Kata sandi</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit">Login</button>
            </form>
            <p class="prototype-note">
                Mode demo: login hanya memeriksa nama dan email akun yang sudah diverifikasi di browser.
                Kata sandi belum diverifikasi server.
            </p>
            <p class="account-prompt">
                Belum punya akun?
                <a class="account-link" href="registrasi.html">Registrasi di sini</a>
            </p>
        </section>
    </main>

    <footer>
        <p> &copy; 2026 Chat App Simpel. All rights reserved.</p>
    </footer>
    <script src="../js/login.js" defer></script>
</body>
</html>
